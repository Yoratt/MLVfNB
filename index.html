<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Просмотр сообщения</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
		<script src="https://cdn.jsdelivr.net/npm/lz-string/libs/lz-string.min.js"></script>
		<meta property="tg:site_verification" content="g7j8/rPFXfhyrq5q0QQV7EsYWv4=">
		<meta property="telegram:channel" content="@gamesinprism_chat">
		<meta property="tg:site_verification" content="g7j8/rPFXfhyrq5q0QQV7EsYWv4=">
		<style>
		#app {
			max-width: 720px;
			margin: 40px auto;
			padding: 0 16px;
			font: 16px/1.6 system-ui;
		}
		</style>
	</head>
	<body>
		<div id="app">
			<div class="article">
				<article class="article__content">
					<p>Данные не были предоставлены.</p>
				</article>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
		<script>
		const params = new URLSearchParams(window.location.search);
		const payload = params.get('t');

		if (payload) {
			const md = window.markdownit({ html:false, linkify:true, typographer:true })
			  .use(texmath, { engine:katex, delimiters:'dollars', katexOptions:{ throwOnError:false }});

			const mdText = LZString.decompressFromEncodedURIComponent(payload);
			document.querySelector('.article__content').innerHTML = md.render(mdText);
		}
		</script>
	</body>
</html>
